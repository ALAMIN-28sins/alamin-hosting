<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সময় শেষ | ALAMIN HOSTING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0a0c12; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .glow-box { box-shadow: 0 0 40px rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-[#12141c] border border-red-500/30 rounded-2xl p-8 max-w-md w-full text-center glow-box">
        
        <!-- আইকন -->
        <div class="w-24 h-24 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-red-500/20">
            <i class="fas fa-clock text-5xl text-red-500 animate-pulse"></i>
        </div>
        
        <!-- টাইটেল -->
        <h1 class="text-2xl font-bold mb-3 text-red-400">⏰ আপনার সময় শেষ!</h1>
        
        <!-- মেসেজ -->
        <p class="text-gray-400 text-sm mb-8 leading-relaxed">
            আপনার ফ্রি সার্ভারের মেয়াদ শেষ হয়ে গেছে। <br>
            সার্ভারটি চালু করতে হলে অ্যাডমিনের সাথে যোগাযোগ করুন।
        </p>

        <!-- টেলিগ্রাম লিংক -->
        <div class="bg-[#0a0c12] border border-gray-800 rounded-xl p-4 mb-6">
            <p class="text-xs text-gray-500 mb-2">টেলিগ্রামে যোগাযোগ করুন:</p>
            <!-- এখানে আপনার টেলিগ্রাম লিংক বসান -->
            <a href="https://t.me/YOUR_TELEGRAM_USERNAME" target="_blank" class="text-blue-400 font-mono text-sm hover:underline break-all">
                https://t.me/YOUR_TELEGRAM_USERNAME
            </a>
        </div>

        <!-- OK বাটন -->
        <a href="https://t.me/YOUR_TELEGRAM_USERNAME" target="_blank" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white py-3 rounded-lg font-bold text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-blue-500/20">
            <i class="fab fa-telegram-plane text-lg"></i> OK, Go to Telegram
        </a>

        <!-- লগআউট লিংক -->
        <div class="mt-6">
            <a href="/logout" class="text-gray-500 text-xs hover:text-gray-300 transition">
                <i class="fas fa-arrow-left mr-1"></i> ফিরে যান
            </a>
        </div>

    </div>

</body>
</html>
