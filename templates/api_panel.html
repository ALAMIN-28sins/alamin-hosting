<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Panel | ALAMIN HOSTING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background:#0c0e14; color:#fff; font-family:'Segoe UI',sans-serif; }
        .console { background:#0a0a0a; font-family:'Courier New',monospace; height:320px;
            overflow-y:auto; padding:12px; color:#e0e0e0; border:1px solid #2a2a2a;
            border-radius:10px; font-size:12px; white-space:pre-wrap; line-height:1.5; }
        .console::-webkit-scrollbar { width:6px; }
        .console::-webkit-scrollbar-thumb { background:#a855f7; border-radius:3px; }
        .card { background:#12141c; border:1px solid #1e2130; border-radius:12px; padding:16px; transition:all 0.2s; }
        .card:hover { border-color:#a855f7; }
        .btn { padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; transition:all 0.2s; cursor:pointer; border:none; }
        .btn:active { transform:scale(0.95); }
        .toast { position:fixed; bottom:20px; right:20px; z-index:9999;
            background:#1a1d27; border-left:4px solid #a855f7; border-radius:10px;
            padding:12px 16px; min-width:280px; animation:slideIn 0.3s; color:#fff; }
        @keyframes slideIn { from{transform:translateX(400px);opacity:0} to{transform:translateX(0);opacity:1} }
        .status-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; vertical-align:middle; }
    </style>
</head>
<body>

<header class="h-16 bg-[#12141c] border-b border-gray-800 flex items-center px-6 justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-gradient-to-br from-purple-600 to-purple-800">
            <i class="fas fa-code text-white"></i>
        </div>
        <div>
            <h1 class="text-lg font-black">API <span class="text-purple-500">HOSTING</span></h1>
            <p class="text-[10px] text-gray-400">{{ username }}</p>
        </div>
    </div>
    <a href="/logout" class="text-red-500 hover:text-red-400"><i class="fas fa-sign-out-alt"></i> Logout</a>
</header>

<main class="container mx-auto p-4 max-w-6xl">

    <!-- ✅ এখানে MAX FILES এবং DISK (MB) রিমুভ করা হয়েছে -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
        <div class="card">
            <p class="text-[10px] text-gray-500 mb-1">MAX APPS</p>
            <p class="text-lg font-bold text-purple-400">{{ limits.max_apps | default(3) }}</p>
        </div>
        <div class="card">
            <p class="text-[10px] text-gray-500 mb-1">RAM (MB)</p>
            <p class="text-lg font-bold text-green-400">{{ limits.max_ram_mb | default(256) }}</p>
        </div>
        <div class="card">
            <p class="text-[10px] text-gray-500 mb-1">CPU</p>
            <p class="text-lg font-bold text-yellow-400">{{ limits.max_cpu | default(0.5) }}</p>
        </div>
    </div>

    <div class="card mb-6">
        <h2 class="text-md font-bold mb-3"><i class="fas fa-plus-circle text-purple-400 mr-2"></i>Create New API App</h2>
        <div class="grid md:grid-cols-3 gap-3">
            <input id="appName" placeholder="App name (e.g. my-api)"
                class="bg-[#0c0e14] border border-gray-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-purple-500 text-white">
            <select id="appLang"
                class="bg-[#0c0e14] border border-gray-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-purple-500 text-white">
                <option value="node">Node.js (server.js)</option>
                <option value="python">Python (main.py)</option>
            </select>
            <button onclick="createApp()" class="bg-purple-600 hover:bg-purple-500 rounded-lg text-sm font-bold btn text-white">
                <i class="fas fa-plus mr-1"></i> Create
            </button>
        </div>
    </div>

    <div class="card">
        <h2 class="text-md font-bold mb-3"><i class="fas fa-server text-blue-400 mr-2"></i>My API Apps</h2>
        <div id="appsList" class="space-y-3">
            <p class="text-center text-gray-500 py-6">Loading...</p>
        </div>
    </div>

</main>

<div id="appModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-[#12141c] w-full max-w-4xl rounded-xl border border-purple-500 max-h-[90vh] overflow-y-auto">
        <div class="p-4 border-b border-gray-700 flex justify-between items-center">
            <h3 id="modalTitle" class="text-purple-400 font-bold"></h3>
            <button onclick="closeModal()" class="text-red-400 text-xl">&times;</button>
        </div>

        <div class="p-4">
            <div class="flex gap-2 mb-4 flex-wrap">
                <button onclick="startApp()" class="btn bg-green-600 hover:bg-green-500 text-white"><i class="fas fa-play mr-1"></i> Start</button>
                <button onclick="stopApp()" class="btn bg-red-600 hover:bg-red-500 text-white"><i class="fas fa-stop mr-1"></i> Stop</button>
                <button onclick="deleteApp()" class="btn bg-gray-700 hover:bg-gray-600 text-white"><i class="fas fa-trash mr-1"></i> Delete App</button>
            </div>

            <div id="apiUrlBox" class="hidden bg-green-500/10 border border-green-500/30 rounded-lg p-3 mb-4">
                <p class="text-xs text-gray-400 mb-1">API URL:</p>
                <div class="flex items-center gap-2">
                    <code id="apiUrl" class="text-green-400 text-sm flex-1 break-all"></code>
                    <button onclick="copyApiUrl()" class="btn bg-green-600/20 text-green-400 text-xs"><i class="fas fa-copy"></i> Copy</button>
                </div>
            </div>

            <div class="mb-4">
                <label class="text-xs text-gray-400 mb-2 block">📁 Upload Files (.js, .py, package.json, requirements.txt)</label>
                <input type="file" id="fileInput" multiple class="w-full bg-[#0c0e14] border border-gray-700 rounded-lg p-2 text-sm text-white">
                <button onclick="uploadFiles()" class="btn bg-blue-600 hover:bg-blue-500 mt-2 text-white"><i class="fas fa-upload mr-1"></i> Upload</button>
            </div>

            <div class="mb-4">
                <h4 class="text-xs text-gray-400 mb-2">📂 Files</h4>
                <div id="filesList" class="bg-[#0c0e14] rounded-lg divide-y divide-gray-800"></div>
            </div>

            <div>
                <h4 class="text-xs text-gray-400 mb-2">📜 Logs</h4>
                <div class="console" id="appLogs">No logs yet...</div>
            </div>
        </div>
    </div>
</div>

<div id="toastContainer"></div>

<script>
    let apps = [];
    let currentAppId = null;
    let logsInterval = null;

    function showToast(msg, type = 'info') {
        const colors = { info: '#a855f7', success: '#10b981', error: '#ef4444', warning: '#f59e0b' };
        const el = document.createElement('div');
        el.className = 'toast';
        el.style.borderLeftColor = colors[type] || '#a855f7';
        el.innerHTML = `<p class="text-sm">${msg}</p>`;
        document.getElementById('toastContainer').appendChild(el);
        setTimeout(() => el.remove(), 3500);
    }

    async function loadApps() {
        try {
            const r = await fetch('/api/apps/list');
            const d = await r.json();
            apps = d.apps || [];
            renderApps();
        } catch(e) { console.error(e); }
    }

    function renderApps() {
        const el = document.getElementById('appsList');
        if (apps.length === 0) {
            el.innerHTML = '<p class="text-center text-gray-500 py-6">কোনো অ্যাপ নেই। উপরে একটি তৈরি করুন।</p>';
            return;
        }
        el.innerHTML = apps.map(a => `
            <div class="bg-[#0c0e14] border border-gray-800 rounded-lg p-3 flex justify-between items-center hover:border-purple-500 cursor-pointer transition" onclick="openApp('${a.app_id}')">
                <div>
                    <p class="font-bold text-sm">${a.name} <span class="text-xs text-gray-500">(${a.language})</span></p>
                    <p class="text-xs text-gray-500 mt-1">${a.files_count} files · ${(a.used_size_bytes/1024).toFixed(1)} KB</p>
                </div>
                <span class="text-xs px-3 py-1 rounded-full ${a.status === 'running' ? 'bg-green-500/20 text-green-400' : 'bg-gray-500/20 text-gray-400'}">
                    <i class="fas fa-circle text-[6px] mr-1"></i>${a.status.toUpperCase()}
                </span>
            </div>
        `).join('');
    }

    async function createApp() {
        const name = document.getElementById('appName').value.trim();
        const language = document.getElementById('appLang').value;
        if (!name) return showToast('App name দিন!', 'error');

        const r = await fetch('/api/apps/create', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, language})
        });
        const d = await r.json();
        if (d.error) return showToast(d.error, 'error');
        showToast('✅ অ্যাপ তৈরি হয়েছে!', 'success');
        document.getElementById('appName').value = '';
        loadApps();
    }

    async function openApp(appId) {
        currentAppId = appId;
        const app = apps.find(a => a.app_id === appId);
        document.getElementById('modalTitle').innerHTML = `<i class="fas fa-server mr-2"></i>${app.name} (${app.language})`;
        document.getElementById('appModal').classList.remove('hidden');

        if (app.status === 'running' && app.port) {
            showApiUrl(appId);
        } else {
            document.getElementById('apiUrlBox').classList.add('hidden');
        }

        loadFiles(appId);
        loadLogs(appId);

        if (logsInterval) clearInterval(logsInterval);
        logsInterval = setInterval(() => loadLogs(appId), 3000);
    }

    function showApiUrl(appId) {
        const url = window.location.origin + '/api-proxy/' + appId + '/';
        document.getElementById('apiUrl').textContent = url;
        document.getElementById('apiUrlBox').classList.remove('hidden');
    }

    function copyApiUrl() {
        const txt = document.getElementById('apiUrl').textContent;
        navigator.clipboard.writeText(txt).then(() => showToast('✅ কপি হয়েছে!', 'success'));
    }

    function closeModal() {
        document.getElementById('appModal').classList.add('hidden');
        if (logsInterval) clearInterval(logsInterval);
        currentAppId = null;
        loadApps();
    }

    async function startApp() {
        showToast('চালু হচ্ছে...', 'info');
        const r = await fetch(`/api/apps/${currentAppId}/start`, {method: 'POST'});
        const d = await r.json();
        if (d.error) return showToast(d.error, 'error');
        showToast('✅ চালু হয়েছে!', 'success');
        showApiUrl(currentAppId);
        loadApps();
    }

    async function stopApp() {
        const r = await fetch(`/api/apps/${currentAppId}/stop`, {method: 'POST'});
        await r.json();
        showToast('⏹️ বন্ধ হয়েছে', 'warning');
        document.getElementById('apiUrlBox').classList.add('hidden');
        loadApps();
    }

    async function deleteApp() {
        if (!confirm('অ্যাপটি মুছে ফেলবেন?')) return;
        const r = await fetch(`/api/apps/${currentAppId}/delete`, {method: 'POST'});
        await r.json();
        showToast('🗑️ মুছে ফেলা হয়েছে', 'success');
        closeModal();
    }

    async function uploadFiles() {
        const input = document.getElementById('fileInput');
        if (!input.files.length) return showToast('ফাইল নির্বাচন করুন!', 'error');

        const fd = new FormData();
        for (const f of input.files) fd.append('files', f);

        showToast('আপলোড হচ্ছে...', 'info');
        const r = await fetch(`/api/apps/${currentAppId}/upload`, {method: 'POST', body: fd});
        const d = await r.json();
        if (d.error) return showToast(d.error, 'error');
        showToast(`✅ ${d.uploaded} ফাইল আপলোড হয়েছে!`, 'success');
        input.value = '';
        loadFiles(currentAppId);
        loadApps();
    }

    async function loadFiles(appId) {
    const r = await fetch(`/api/apps/${appId}/files`);
    const d = await r.json();
    const files = d.files || [];
    const el = document.getElementById('filesList');
    if (files.length === 0) {
        el.innerHTML = '<p class="p-3 text-center text-gray-500 text-xs">কোনো ফাইল নেই</p>';
        return;
    }

    el.innerHTML = files.map(f => {
        // ফাইল টাইপ অনুযায়ী আইকন
        let icon = 'fa-file-code';
        let color = 'text-blue-400';
        const ext = f.name.split('.').pop().toLowerCase();
        if (ext === 'json') { icon = 'fa-file-code'; color = 'text-yellow-400'; }
        else if (ext === 'py') { icon = 'fa-file-code'; color = 'text-green-400'; }
        else if (ext === 'js') { icon = 'fa-file-code'; color = 'text-yellow-300'; }
        else if (ext === 'txt' || ext === 'md') { icon = 'fa-file-alt'; color = 'text-gray-400'; }
        else if (ext === 'zip') { icon = 'fa-file-archive'; color = 'text-orange-400'; }
        else if (ext === 'html') { icon = 'fa-file-code'; color = 'text-red-400'; }
        else if (ext === 'css') { icon = 'fa-file-code'; color = 'text-cyan-400'; }

        return `
        <div class="p-2 flex justify-between items-center hover:bg-[#1a1d27] rounded">
            <div class="flex items-center gap-2 flex-1 min-w-0">
                <i class="fas ${icon} ${color}"></i>
                <span class="text-xs truncate">${f.path}</span>
                <span class="text-[10px] text-gray-500 flex-shrink-0">${(f.size/1024).toFixed(1)} KB</span>
            </div>
            <div class="flex items-center gap-1 flex-shrink-0">
                <button onclick="editFile('${f.path}')" class="text-blue-400 hover:text-blue-300 text-xs px-2" title="Edit">
                    <i class="fas fa-edit"></i>
                </button>
                <button onclick="renameFile('${f.path}')" class="text-yellow-400 hover:text-yellow-300 text-xs px-2" title="Rename">
                    <i class="fas fa-i-cursor"></i>
                </button>
                <button onclick="deleteFile('${f.path}')" class="text-red-400 hover:text-red-300 text-xs px-2" title="Delete">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
        `;
    }).join('');
}

// ✅ ফাইল রিনেম
async function renameFile(oldPath) {
    const oldName = oldPath.split('/').pop();
    const newName = prompt(`নতুন নাম দিন (বর্তমান: ${oldName})`, oldName);
    if (!newName || newName === oldName) return;

    // path থেকে directory আলাদা করুন
    const dir = oldPath.includes('/') ? oldPath.substring(0, oldPath.lastIndexOf('/') + 1) : '';
    const newPath = dir + newName;

    const r = await fetch(`/api/apps/${currentAppId}/rename_file`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({old_path: oldPath, new_path: newPath})
    });
    const d = await r.json();
    if (d.error) return showToast(d.error, 'error');
    showToast('✅ রিনেম হয়েছে!', 'success');
    loadFiles(currentAppId);
}

// ✅ ফাইল এডিট
async function editFile(path) {
    const r = await fetch(`/api/apps/${currentAppId}/read_file?path=${encodeURIComponent(path)}`);
    const d = await r.json();
    if (d.error) return showToast(d.error, 'error');

    // Modal তৈরি করুন
    const modal = document.createElement('div');
    modal.id = 'fileEditorModal';
    modal.className = 'fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[60]';
    modal.innerHTML = `
        <div class="bg-[#12141c] w-full max-w-3xl rounded-xl border border-purple-500">
            <div class="p-3 border-b border-gray-700 flex justify-between items-center">
                <h3 class="text-purple-400 text-sm font-bold"><i class="fas fa-edit mr-2"></i>${path}</h3>
                <button onclick="closeEditor()" class="text-red-400 text-xl">&times;</button>
            </div>
            <textarea id="editorContent" class="w-full h-96 bg-black text-green-400 p-3 font-mono text-xs outline-none resize-none">${(d.content || '').replace(/</g, '&lt;')}</textarea>
            <div class="p-3 border-t border-gray-700 flex justify-end gap-2">
                <button onclick="closeEditor()" class="btn bg-gray-700 hover:bg-gray-600 text-white text-xs">Cancel</button>
                <button onclick="saveEditor('${path}')" class="btn bg-blue-600 hover:bg-blue-500 text-white text-xs"><i class="fas fa-check mr-1"></i> Save</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

function closeEditor() {
    const m = document.getElementById('fileEditorModal');
    if (m) m.remove();
}

async function saveEditor(path) {
    const content = document.getElementById('editorContent').value;
    const r = await fetch(`/api/apps/${currentAppId}/write_file`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({path: path, content: content})
    });
    const d = await r.json();
    if (d.error) return showToast(d.error, 'error');
    showToast('✅ সেভ হয়েছে!', 'success');
    closeEditor();
    loadFiles(currentAppId);
}

    async function deleteFile(path) {
        if (!confirm(`"${path}" মুছবেন?`)) return;
        const r = await fetch(`/api/apps/${currentAppId}/delete_file`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({filename: path})
        });
        const d = await r.json();
        if (d.error) return showToast(d.error, 'error');
        loadFiles(currentAppId);
        loadApps();
    }

    async function loadLogs(appId) {
        const r = await fetch(`/api/apps/${appId}/logs`);
        const d = await r.json();
        const el = document.getElementById('appLogs');
        el.textContent = d.logs || 'No logs yet...';
        el.scrollTop = el.scrollHeight;
    }

    loadApps();
    setInterval(loadApps, 5000);
</script>
</body>
</html>
