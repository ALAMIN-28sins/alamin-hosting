<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Login | ALAMIN HOSTING</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); padding:40px;
    border-radius:20px; width:100%; max-width:420px;
    border:1px solid rgba(255,255,255,0.1); box-shadow:0 20px 60px rgba(0,0,0,0.4); position: relative; }
  h1 { color:#fff; text-align:center; margin-bottom:8px; font-size:1.6rem; }
  .subtitle { color:#7b7ba0; text-align:center; font-size:0.8rem; margin-bottom:30px; }
  .form-group { margin-bottom:20px; }
  label { display:block; color:#b0b0d0; margin-bottom:8px; font-size:0.9rem; }
  input, select { width:100%; padding:14px; border-radius:10px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
    color:#fff; font-size:1rem; outline:none; transition:border-color 0.2s; }
  input:focus, select:focus { border-color:#00d4ff; box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
  select option { background:#24243e; color:#fff; }
  button[type="submit"] { width:100%; padding:14px; border:none; border-radius:10px;
    background:linear-gradient(90deg,#00d4ff,#7b2ff7); color:#fff;
    font-size:1rem; font-weight:600; cursor:pointer; margin-top:10px;
    transition:all 0.3s; position:relative; overflow:hidden; }
  button[type="submit"]:hover { opacity:0.9; transform:translateY(-1px); box-shadow:0 10px 25px rgba(0,212,255,0.3); }
  .error { background:rgba(255,50,50,0.2); color:#ff8080; padding:12px;
    border-radius:8px; margin-bottom:20px; text-align:center; font-size:0.9rem;
    border: 1px solid rgba(255,50,50,0.3); animation: shake 0.5s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .role-hint { color:#7b7ba0; font-size:0.75rem; margin-top:6px; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px; vertical-align:middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Admin Button & Modal Styles */
  .admin-link-btn {
    display: block; text-align: center; margin-top: 25px; color: #7b7ba0; 
    font-size: 0.85rem; text-decoration: none; cursor: pointer; transition: color 0.3s;
    background: transparent; border: none; width: 100%;
  }
  .admin-link-btn:hover { color: #00d4ff; }
  .admin-link-btn i { margin-right: 5px; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .admin-modal {
    background: #1a1d27; border: 1px solid rgba(0,212,255,0.3); border-radius: 20px;
    padding: 30px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: zoomIn 0.3s ease-out;
  }
  @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .admin-modal h2 { color: #fff; margin-bottom: 20px; text-align: center; font-size: 1.3rem; }
  .modal-close {
    position: absolute; top: 15px; right: 15px; color: #ff4d4d; background: rgba(255,0,0,0.1);
    border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: 0.2s;
  }
  .modal-close:hover { background: #ff4d4d; color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <h1>🚀 Server Login</h1>
    <p class="subtitle">ALAMIN HOSTING PANEL</p>
    
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    
    <form method="POST" autocomplete="off" id="loginForm" novalidate>
      <div class="form-group">
        <label>🎭 Select Role</label>
        <!-- ✅ Admin অপশন বাদ দেওয়া হয়েছে -->
        <select name="role" required id="roleSelect" onchange="updateFields()" autocomplete="off">
          <option value="file_server" selected>📁 File Server</option>
          <option value="html_server">🌐 HTML Server</option>
          <option value="api_server">🚀 API Server</option>
        </select>
        <div class="role-hint" id="roleHint">File Server: username + password দিয়ে login করুন।</div>
      </div>
      <div class="form-group">
        <label id="userLabel">👤 Username</label>
        <input type="text" name="username" id="userInput" required placeholder="server-username"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="form-group">
        <label>🔑 Password</label>
        <input type="password" name="password" id="passInput" required placeholder="••••••••"
               autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')">
      </div>
      <button type="submit" id="loginBtn">Sign In</button>
    </form>

    <!-- ✅ Admin Login Button (নিচে ছোট করে) -->
    <button class="admin-link-btn" onclick="openAdminModal()">
      <i class="fas fa-user-shield"></i> Admin Login
    </button>
  </div>

  <!-- ✅ Admin Login Modal Popup -->
  <div class="modal-overlay" id="adminModal">
    <div class="admin-modal" style="position: relative;">
      <button class="modal-close" onclick="closeAdminModal()">&times;</button>
      <h2>🛡️ Admin Login</h2>
      
      <form method="POST" action="/login" autocomplete="off">
        <!-- গোপন রোল পাঠানো হচ্ছে যাতে ব্যাকএন্ড চিনতে পারে -->
        <input type="hidden" name="role" value="admin">
        
        <div class="form-group">
          <label>📧 Admin Email</label>
          <input type="email" name="username" required placeholder="admin@example.com" autocomplete="off">
        </div>
        <div class="form-group">
          <label>🔑 Password</label>
          <input type="password" name="password" required placeholder="••••••••" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')">
        </div>
        <button type="submit">Secure Login</button>
      </form>
    </div>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <script>
    window.addEventListener('DOMContentLoaded', function() {
        const emailInput = document.getElementById('userInput');
        const passInput = document.getElementById('passInput');

        if (emailInput) {
            emailInput.value = '';
            emailInput.setAttribute('autocomplete', 'off');
        }
        if (passInput) {
            passInput.value = '';
            passInput.setAttribute('autocomplete', 'new-password');
        }

        setTimeout(() => {
            if (passInput) passInput.removeAttribute('readonly');
        }, 100);
    });

    function updateFields() {
      const role = document.getElementById('roleSelect').value;
      const hint = document.getElementById('roleHint');

      if (role === 'file_server') {
        hint.textContent = 'File Server: username + password দিয়ে login করুন।';
      } else if (role === 'html_server') {
        hint.textContent = 'HTML Server: username + password দিয়ে login করুন।';
      } else if (role === 'api_server') {
        hint.textContent = 'API Server: username + password দিয়ে login করুন।';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in...';
    });

    // ✅ Modal Functions
    function openAdminModal() {
      document.getElementById('adminModal').classList.add('active');
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.remove('active');
    }

    // মডালের বাইরে ক্লিক করলে বন্ধ হবে
    document.getElementById('adminModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeAdminModal();
      }
    });
  </script>
</body>
</html>
